# Support for evtx converted in json by evtx_dump (https://github.com/omerbenamram/evtx)
# (Tested on FCSC2025 / SOCrate: https://hackropole.fr/en/challenges/forensics/fcsc2025-forensics-socrate-1/)


filter {
  if [labels][type] == "evtx_dump" {

    # Set timestamp
    date {
      match => [ "[raw][Event][System][TimeCreated][#attributes][SystemTime]", "ISO8601" ]
    }
    mutate {
      remove_field => [ "[raw][Event][System][TimeCreated][#attributes][SystemTime]" ]
    }

    # rename common fields to standard names
    mutate {
      rename => {
        "[raw][Event][EventData][SourceIp]" => "[source][ip]"
        "[raw][Event][EventData][SourcePort]" => "[source][port]"
        "[raw][Event][EventData][DestinationIp]" => "[destination][ip]"
        "[raw][Event][EventData][DestinationPort]" => "[destination][port]"

      }
    }

    # Flatten structures
    mutate {
      rename => {
        "[raw][Event][EventData]" => "[eventdata]"
        "[raw][Event][System]" => "[system]"
      }
    }

    # Get rid of #attributes
    mutate {
      rename => {
        "[system][Provider][#attributes]" => "[system][Provider]"
        "[system][Execution][#attributes]" => "[system][Execution]"
        "[system][Security][#attributes]" => "[system][Security]"
        "[system][Correlation][#attributes]" => "[system][Correlation]"
        "[eventdata][#attributes][Name]" => "[eventdata][Name]"
      }
    }

    # Resolve type conflicts
    # system.Provider.EventId can be an integer, OR a (useless) struct. Remove the latter.
    if [system][EventID][#attributes] {
      mutate {
        remove_field => [ "[system][EventID]" ]
      }
    }
    # Sometimes, EventData.Signed is neither true or false, but failed with an error message
    mutate {
      convert => {
        "[eventdata][Signed]" => "string"
      }
    }
    # If EventData.Archived is no true, there also an error message. Convert it to false.
    if [eventdata][Archived] != "true" {
      mutate => {
        replace => [ "[eventdata][archived]", "false" ]
      }
    }

    # Remove original message
    mutate {
      remove_field => [ "[raw]", "[event][original]" ]
    }
  }
}
