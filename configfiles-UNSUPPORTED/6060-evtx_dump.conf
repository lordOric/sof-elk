#
# This file contains filters, transforms, and enrichments for sysmon messages
# It was initially developed to support logs from sysmon for linux via syslog

# Inspired from 6050-sysmon as in my case, the body is very similar.
# (FCSC2025 / SOCrate: https://hackropole.fr/en/challenges/forensics/fcsc2025-forensics-socrate-1/)

# <Event><System><Provider Name="Linux-Sysmon" Guid="{ff032593-a8d3-4f13-b0d6-01fc615a0f97}"/><EventID>3</EventID><Version>5</Version><Level>4</Level><Task>3</Task><Opcode>0</Opcode><Keywords>0x8000000000000000</Keywords><TimeCreated SystemTime="2023-03-17T07:00:24.306312000Z"/><EventRecordID>28253492</EventRecordID><Correlation/><Execution ProcessID="834" ThreadID="834"/><Channel>Linux-Sysmon/Operational</Channel><Computer>starkskunk5</Computer><Security UserId="0"/></System><EventData><Data Name="RuleName">-</Data><Data Name="UtcTime">2023-03-17 07:00:24.309</Data><Data Name="ProcessGuid">{ec2ee89f-0ff1-6414-6d55-7c13e9550000}</Data><Data Name="ProcessId">785807</Data><Data Name="Image">/usr/usr/sbin/logrotate</Data><Data Name="User">root</Data><Data Name="Protocol">udp</Data><Data Name="Initiated">true</Data><Data Name="SourceIsIpv6">false</Data><Data Name="SourceIp">10.130.9.15</Data><Data Name="SourceHostname">-</Data><Data Name="SourcePort">59672</Data><Data Name="SourcePortName">-</Data><Data Name="DestinationIsIpv6">false</Data><Data Name="DestinationIp">10.130.8.2</Data><Data Name="DestinationHostname">-</Data><Data Name="DestinationPort">53</Data><Data Name="DestinationPortName">-</Data></EventData></Event>

filter {
  if [labels][type] == "evtx_dump" {

    # parse the json into the "evtxdump" object
    json {
      source => "message"
      target => "evtxdump"
      force_content => false
      force_array => false
    }

    if [evtxdump][System][TimeCreated][SystemTime] {
      date {
        match => [ "[evtxdump][System][TimeCreated][SystemTime]", "ISO8601" ]
      }
    }
    mutate {
      remove_field => [ "[evtxdump][System][TimeCreated][SystemTime]" ]
    }

    if [evtxdump][System][EventID] {
      translate {
        dictionary_path => "/usr/local/sof-elk/lib/dictionaries/eventid2desc.yaml"
        source => "[evtxdump][System][EventID]"
        target => "[evtxdump][System][EventIDDescription]"
      }
    }

    if [evtxdump][EventData][Data] {
      ruby {
        path => "/usr/local/sof-elk/supporting-scripts/split_kv_to_fields.rb"
        script_params => {
          "source_field" => "[evtxdump][EventData][Data]"
          "destination_field" => "[evtxdump][EventData]"
          "key_field" => "Name"
          "val_field" => "content"
        }
      }
      mutate {
        remove_field => [ "[evtxdump][EventData][Data]" ]
      }
    }

    if [evtxdump][System][Provider][Guid] {
      mutate {
        gsub => [ "[evtxdump][System][Provider][Guid]", "[{}]", "" ]
      }
    }
    if [evtxdump][EventData][ProcessGuid] {
      mutate {
        gsub => [ "[evtxdump][EventData][ProcessGuid]", "[{}]", "" ]
      }
    }

    # populate message field??
    # remove empty objects: System.TimeCreated, ???

    # rename common fields to standard names
    mutate {
      # overwrite the syslog hostname so we get the hostname of the actual source system instead
      # I am quite sure the log.syslog.procid override is correct, but I'm leaving this note here for further confirmation before declaring it final
      rename => {
        "[evtxdump][EventData][SourceIp]" => "[source][ip]"
        "[evtxdump][EventData][SourcePort]" => "[source][port]"
        "[evtxdump][EventData][DestinationIp]" => "[destination][ip]"
        "[evtxdump][EventData][DestinationPort]" => "[destination][port]"
      }
      replace => {
        "[log][syslog][procid]" => "%{[evtxdump][EventData][ProcessId]}"
        "[log][syslog][hostname]" => "%{[evtxdump][System][Computer]}"
        "[log][syslog][appname]" => "%{[evtxdump][EventData][Image]}"
      }
    }
    mutate {
      remove_field => [
        "[evtxdump][EventData][ProcessId]",
        "[evtxdump][System][Computer]",
        "[evtxdump][EventData][Image]"
      ]
    }

    # recast known fields to proper types
    mutate {
      convert => {
        "[log][syslog][procid]" => "integer"
        "[evtxdump][System][EventID]" => "integer"
        "[evtxdump][System][Level]" => "integer"
        "[evtxdump][System][Opcode]" => "integer"
        "[evtxdump][System][Task]" => "integer"
        "[evtxdump][System][Security][UserId]" => "integer"
        "[evtxdump][System][Version]" => "integer"
        "[evtxdump][System][EventRecordID]" => "integer"
        "[evtxdump][System][Execution][ProcessID]" => "integer"
        "[evtxdump][System][Execution][ThreadID]" => "integer"

        "[evtxdump][EventData][Initiated]" => "boolean"
        "[evtxdump][EventData][SourceIsIpv6]" => "boolean"
        "[evtxdump][EventData][DestinationIsIpv6]" => "boolean"
      }
    }

    # build a new "message" field
    mutate {
      replace => { "message" => "evtxdump:%{[evtxdump][System][EventIDDescription]}" }
    }

    mutate {
      add_tag => [ "parse_done" ]
    }

  }
}
